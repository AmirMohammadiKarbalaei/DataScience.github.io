<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00d4ff" />

    <!-- Basic SEO Meta Tags -->
    <title>Amir Mohammadikarbalaei - Data Scientist & AI Engineer | Portfolio</title>
    <meta name="description" content="Data Scientist and AI Engineer working on NLP, LLMs and machine learning at Unilever. MSc Data Science, University of Bath. Portfolio of applied ML projects in NLP, deep learning, computer vision and reinforcement learning." />
    <meta name="author" content="Amir Mohammadikarbalaei" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://amir-data.vercel.app/" />

    <!--
      Open Graph and Twitter tags are duplicated here as static markup on purpose.
      LinkedIn, Slack, WhatsApp and X crawlers do not execute JavaScript, so the
      copies injected client-side by react-helmet in SEOHead.tsx never reach them.
      Without these, sharing a link to this site produces a preview with no image.
      Keep the two in sync when the description or banner changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amir-data.vercel.app/" />
    <meta property="og:title" content="Amir Mohammadikarbalaei - Data Scientist & AI Engineer" />
    <meta property="og:description" content="Data Scientist and AI Engineer working on NLP, LLMs and machine learning at Unilever. MSc Data Science, University of Bath." />
    <meta property="og:image" content="https://amir-data.vercel.app/media/data-science-new-banner.jpg" />
    <meta property="og:image:alt" content="Amir Mohammadikarbalaei - Data Science Portfolio" />
    <meta property="og:site_name" content="Amir Mohammadikarbalaei - Data Science Portfolio" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amir Mohammadikarbalaei - Data Scientist & AI Engineer" />
    <meta name="twitter:description" content="Data Scientist and AI Engineer working on NLP, LLMs and machine learning at Unilever. MSc Data Science, University of Bath." />
    <meta name="twitter:image" content="https://amir-data.vercel.app/media/data-science-new-banner.jpg" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--
      Google Analytics is loaded here only. Do not also call initGA() in App.tsx:
      running both fires duplicate pageviews.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQ3XRNKMPF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FQ3XRNKMPF');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
